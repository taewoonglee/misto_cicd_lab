replicaCount: 2

image:
  repository: nginx
  tag: "1.27"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi


appB:
  replicaCount: 1
  image:
    repository: httpd
    tag: "2.4"

networkPolicy:
  enabled: true
  allowFromA: false

testClients:
  enabled: true
