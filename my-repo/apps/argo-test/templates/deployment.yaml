apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "argo-test.fullname" . }}
  labels:
    {{- include "argo-test.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "argo-test.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "argo-test.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          resources:
            {{- toYaml .Values.resources | nindent 12 }}