{{- if .Values.testClients.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: client-a
  labels:
    {{- include "argo-test.selectorLabels" . | nindent 4 }}
spec:
  containers:
    - name: netshoot
      image: nicolaka/netshoot
      command: ["sleep", "infinity"]
---
apiVersion: v1
kind: Pod
metadata:
  name: client-other
  labels:
    app: other
spec:
  containers:
    - name: netshoot
      image: nicolaka/netshoot
      command: ["sleep", "infinity"]
  {{- end }}