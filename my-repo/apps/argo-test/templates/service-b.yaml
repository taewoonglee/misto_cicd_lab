apiVersion: v1
kind: Service
metadata:
  name: {{ include "argo-test.fullname" . }}-b
  labels:
    app: {{ include "argo-test.fullname" . }}-b
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "argo-test.fullname" . }}-b
  ports:
      - name: http
        port: {{ .Values.service.port }}
        targetPort: http
